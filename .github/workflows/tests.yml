name: Tests

on:
  push:
    paths: ["veille/**", "tests/**", "site/**", "config.yaml", "requirements.txt"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu > /dev/null
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
