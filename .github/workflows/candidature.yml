name: Préparer une candidature

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      offre:
        description: "Identifiant de l'offre (ex. kit-kastel-pets-2026)"
        required: true
      accroche:
        description: "Accroche à utiliser (1, 2 ou 3)"
        default: "1"

permissions:
  contents: read
  issues: write

jobs:
  preparer:
    # Réservé au propriétaire du dépôt
    if: >
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, 'candidature:'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Polices et bibliothèques PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu fonts-liberation > /dev/null
      - run: pip install -r requirements.txt
      - name: Rédiger notes, lettre et CV puis les envoyer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROFIL_CANDIDAT: ${{ secrets.PROFIL_CANDIDAT }}
          GMAIL_ADRESSE: ${{ secrets.GMAIL_ADRESSE }}
          GMAIL_MOT_DE_PASSE_APP: ${{ secrets.GMAIL_MOT_DE_PASSE_APP }}
          EMAIL_DESTINATAIRE: ${{ secrets.EMAIL_DESTINATAIRE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITRE_TICKET: ${{ github.event.issue.title }}
          AUTEUR_TICKET: ${{ github.event.issue.user.login || github.actor }}
          OFFRE: ${{ inputs.offre }}
          ACCROCHE: ${{ inputs.accroche }}
        run: |
          if [ -z "$TITRE_TICKET" ]; then TITRE_TICKET="candidature: $OFFRE accroche=${ACCROCHE:-1}"; fi
          python -m veille.candidature.generer "$TITRE_TICKET"
      - name: Fermer le ticket
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
          RESULTAT: ${{ job.status }}
        run: |
          if [ "$RESULTAT" = "success" ]; then
            gh issue close "$NUMERO" -R "$GITHUB_REPOSITORY" --comment "Documents préparés et envoyés par email et Telegram (ils ne sont pas publiés ici)."
          else
            gh issue comment "$NUMERO" -R "$GITHUB_REPOSITORY" --body "La préparation a échoué. Ouvre l'onglet Actions pour voir l'étape en erreur."
          fi
